function renderMatchCalendar(list){const el=$('#matchCalendar'),y=matchMonth.getFullYear(),m=matchMonth.getMonth(),days=new Date(y,m+1,0).getDate(),offset=new Date(y,m,1).getDay(),byDate={};list.forEach(x=>{(byDate[x.date]||=[]).push(x)});const short=s=>Array.from(String(s||'')).slice(0,4).join('');el.innerHTML=`<label class="match-calendar-date">日付<input type="date" id="matchCalendarDate" value="${selectedMatchDate||localMatchDate(new Date(y,m,1))}"></label><div class="match-month"><button type="button" id="matchPrev" aria-label="前月">‹</button><button type="button" id="matchMonthSelect" title="この月の一覧を表示">${y}年${m+1}月</button><button type="button" id="matchNext" aria-label="翌月">›</button></div><div class="match-days">${['日','月','火','水','木','金','土'].map(d=>`<span>${d}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const date=localMatchDate(new Date(y,m,i+1)),events=byDate[date]||[];return `<button type="button" data-match-date="${date}" aria-label="${esc(date+' '+events.map(x=>(x.title||'無題')+' '+(x.venue||'')).join('、'))}">${i+1}${events.map(x=>`<span class="match-calendar-event"><span class="event-venue">${esc(short(x.venue))}</span><span class="event-title">${esc(short(x.title||'無題'))}</span></span>`).join('')}</button>`}).join('')}</div><button type="button" id="matchGoogleSync">Googleカレンダーと同期</button><p style="font-size:10px;color:#7d838b">このアプリの対戦記録の登録・更新・削除をGoogleカレンダーに反映します。Googleの「未確認」警告が出る場合は、管理者による連携アプリの審査対応が必要です。</p><p id="matchSyncStatus" role="status"></p>`;$('#matchPrev').onclick=()=>{matchMonth=new Date(y,m-1,1);renderMatches()};$('#matchNext').onclick=()=>{matchMonth=new Date(y,m+1,1);renderMatches()};$('#matchMonthSelect').onclick=()=>showMatchFiltered('',`${y}-${String(m+1).padStart(2,'0')}`);$('#matchCalendarDate').onchange=e=>{if(!e.target.value)return;const [year,month]=e.target.value.split('-').map(Number);matchMonth=new Date(year,month-1,1);selectedMatchDate=e.target.value;renderMatches()};$$('[data-match-date]',el).forEach(b=>b.onclick=()=>showMatchFiltered(b.dataset.matchDate,''));$('#matchGoogleSync').onclick=async()=>{const button=$('#matchGoogleSync'),status=$('#matchSyncStatus');button.disabled=true;status.textContent='Googleカレンダーに接続しています…';try{const result=await window.NineBoardCalendar.sync(store.get('9b_matches'));status.textContent=`${result.synced}件を同期しました${result.skipped?'（日付未登録 '+result.skipped+'件）':''}`}catch(error){status.textContent=error.message||'同期できませんでした'}finally{button.disabled=false}}}

window.addEventListener('storage',e=>{if(e.key==='9b_matches'){matchPage('list');renderMatches()}});

function renderHome(){if(!document.getElementById("homeSummary"))return;const l=store.get("9b_layouts"),c=store.get("9b_counter"),m=store.get("9b_matches");$("#homeSummary").innerHTML=`<div class="summary-row"><strong>保存した配置</strong><span class="badge">${l.length}件</span></div><div class="summary-row"><strong>スコア履歴</strong><span class="badge">${c.length}件</span></div><div class="summary-row"><strong>対戦記録</strong><span class="badge">${m.length}件</span></div>`}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
renderLayout();renderSaved();renderCounter();renderMatches();renderHome();applyZoom();go((location.hash||"#home").slice(1),false);
})();</script>
