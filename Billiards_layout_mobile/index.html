<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>9BOARD Mobile</title>
<link rel="stylesheet" href="styles.css?v=20260921-v7">
</head>
<body>
<div class="phone">
<main class="app-view" id="appView">
<section class="screen active" data-screen="home">
<header class="home-header">
<img class="brand-logo" src="https://raw.githubusercontent.com/waraka2026/pool-note/main/assets/brand-logo.png" alt="9BOARD">
<p class="tagline">Billiardsを記録するアプリ</p>
</header>
<div class="wrap">
<div class="section-title"><h2>よく使う機能</h2></div>
<div class="grid2">
<button class="feature jump" data-to="layout"><span class="ficon green">◫</span><b>配置図</b><small>球・線・矢印・メモ</small></button>
<button class="feature jump" data-to="counter"><span class="ficon blue">#</span><b>カウンター</b><small>平場のスコア記録</small></button>
<button class="feature jump" data-to="matches"><span class="ficon yellow">▤</span><b>対戦記録</b><small>大会・結果・メモ</small></button>
<button class="feature jump" data-to="menu"><span class="ficon red">☰</span><b>その他</b><small>保存データ・設定</small></button>
</div>
<div class="section-title"><h2>アプリの状態</h2></div>
<div class="card" id="homeSummary"></div>
</div>
</section>

<section class="screen" data-screen="layout">
<header class="topbar"><div><strong>配置図</strong><small>Layout Maker</small></div><div class="top-actions"><button id="undoTop">↶</button><button id="redoTop">↷</button></div></header>
<div class="wrap">
<div class="page-head"><h1>配置を作る</h1><button id="clearLayout">リセット</button></div>
<div class="layout-card">
<div class="table-viewport" id="tableViewport">
<div class="table-stage" id="tableStage">
<img class="table-frame" src="https://raw.githubusercontent.com/waraka2026/pool-note/main/assets/reference-table-clean-v2.png" alt="">
<div class="cloth grid-on" id="felt">
<svg id="svgLayer"></svg><div id="aimGuide"></div>
<div id="ballsLayer"></div><div id="notesLayer"></div>
</div>
</div>
</div>
<div class="toolbar" id="layoutToolbar">
<button class="tool active" data-tool="move">✋<span>移動</span></button>
<button class="tool" data-tool="moveall">✥<span>全部移動</span></button>
<button class="tool" data-tool="arrow">↗<span>矢印</span></button>
<button class="tool" data-tool="line">╱<span>線</span></button>
<button class="tool" data-tool="erase">⌫<span>削除</span></button>
<button class="tool" data-tool="memo">✎<span>メモ</span></button>
<button class="tool" id="undoBtn">↶<span>戻る</span></button>
<button class="tool" id="redoBtn">↷<span>進む</span></button>
<button class="tool" id="zoomOut">−<span>縮小</span></button>
<button class="tool" id="zoomIn">＋<span>拡大</span></button>
<button class="tool" id="zoomReset">◎<span>拡大リセット</span></button>
</div>
<div class="ballbar-title">ボール</div>
<div class="ballbar" id="ballbar"></div>
<div class="save-grid"><button id="saveLayout">✓ 配置を保存</button><button id="exportPng" class="alt">▣ 画像保存</button></div>
</div>
<div class="section-title"><h2>保存した配置</h2><button id="clearSavedLayouts">すべて削除</button></div>
<div class="card" id="savedLayouts"></div>
</div>
</section>

<section class="screen" data-screen="counter">
<header class="topbar"><div><strong>カウンター</strong><small>Practice Counter</small></div><button id="resetCounter" class="circle-btn">↻</button></header>
<div class="wrap">
<div class="page-head"><h1>スコア</h1><button id="saveCounter">記録する</button></div>
<div class="counter-card">
<div class="counter-row">
<div class="player"><input id="p1name" value="自分"><div class="score" id="p1score">0</div><div class="score-controls"><button data-score="p1" data-delta="-1">−</button><button data-score="p1" data-delta="1">＋</button></div></div>
<div class="vs">VS</div>
<div class="player"><input id="p2name" value="相手"><div class="score" id="p2score">0</div><div class="score-controls"><button data-score="p2" data-delta="-1">−</button><button data-score="p2" data-delta="1">＋</button></div></div>
</div>
<label class="race">ゲーム形式<select id="raceType"><option>9ボール</option><option>8ボール</option><option>10ボール</option><option>ローテーション</option></select></label>
</div>
<div class="section-title"><h2>最近のカウント</h2><button id="clearCounterHistory">履歴削除</button></div>
<div class="card" id="counterHistory"></div>
</div>
</section>

<section class="screen" data-screen="matches">
<header class="topbar"><div><strong>対戦記録</strong><small>Match Records</small></div><button id="newMatchBtn" class="circle-btn">＋</button></header>
<div class="wrap">
<div class="page-head"><h1>対戦一覧</h1><button id="newMatchText">新規</button></div>
<form id="matchForm" class="new-form">
<div class="cols"><label>日付<input type="date" id="matchDate" required></label><label>状態<select id="matchStatus"><option>終了</option><option>予定</option></select></label></div>
<label>大会名 / 対戦名<input id="matchTitle"></label>
<label>会場名<input id="matchVenue"></label>
<div class="cols"><label>対戦相手<input id="matchOpponent"></label><label>結果<input id="matchResult" placeholder="4-2"></label></div>
<div class="cols"><label>セット数<input id="matchRace" placeholder="4先"></label><label>エントリーフィー<input id="matchFee" inputmode="numeric"></label></div>
<label>URL<input id="matchUrl" type="url" placeholder="https://"></label>
<label>メモ<textarea id="matchMemo"></textarea></label>
<div class="save-grid"><button type="submit">保存</button><button type="button" class="alt" id="cancelMatch">閉じる</button></div>
</form>
<div class="card" id="matchList"></div>
</div>
</section>

<section class="screen" data-screen="menu">
<header class="topbar"><div><strong>メニュー</strong><small>9BOARD Mobile</small></div></header>
<div class="wrap">
<div class="menu-card">
<div class="menu-row">保存した配置 <span>›</span></div>
<div class="menu-row">対戦記録 <span>›</span></div>
<div class="menu-row">カウンター履歴 <span>›</span></div>
<div class="menu-row">設定 <span>›</span></div>
<div class="menu-row">使い方 / ヘルプ <span>›</span></div>
<div class="menu-row">利用規約 <span>›</span></div>
<div class="menu-row">プライバシーポリシー <span>›</span></div>
</div>
</div>
</section>
</main>

<nav class="bottom-nav">
<button class="nav-btn active" data-to="home">⌂<span>ホーム</span></button>
<button class="nav-btn" data-to="layout">◫<span>配置図</span></button>
<button class="nav-btn" data-to="counter">#<span>カウンター</span></button>
<button class="nav-btn" data-to="matches">▤<span>対戦記録</span></button>
<button class="nav-btn" data-to="menu">●<span>メニュー</span></button>
</nav>
<div class="toast" id="toast"></div>
</div>
<script src="app.js?v=20260921-v7"></script>
</body></html>
