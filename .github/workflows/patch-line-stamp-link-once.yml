name: Patch LINE stamp link once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-line-stamp-link-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make LINE stamp image clickable
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<section class="reference-stamps wrap" aria-label="LINEスタンプも公開中！"><img src="assets/original-home-design.png" width="1122" height="1402" alt="LINEスタンプも公開中！ ビリヤード仲間との会話がもっと楽しくなる、かわいいスタンプです。日常でもぜひ使ってみてください。右側のQRコードからご覧ください。" loading="lazy"></section>'
          new='<section class="reference-stamps wrap" aria-label="LINEスタンプも公開中！"><a href="https://store.line.me/stickershop/product/30934872/ja" target="_blank" rel="noopener noreferrer" aria-label="LINEスタンプのページを開く" style="display:block"><img src="assets/original-home-design.png" width="1122" height="1402" alt="LINEスタンプも公開中！ ビリヤード仲間との会話がもっと楽しくなる、かわいいスタンプです。日常でもぜひ使ってみてください。画像をクリックするとLINEスタンプのページが開きます。" loading="lazy" style="display:block;width:100%;height:auto"></a></section>'
          if old not in s:
              raise SystemExit('target section not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-line-stamp-link-once.yml
          git commit -m "Link LINE stamp image to LINE STORE"
          git push