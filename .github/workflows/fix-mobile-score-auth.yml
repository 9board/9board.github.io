name: Fix mobile score clock and auth flash

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-score-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load landscape add-on only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Billiards_layout_mobile/index.html')
          s=p.read_text()
          tag='<script src="landscape-mode.js?v=20261002-landscape1"></script>'
          if tag not in s:
              anchor='<script src="plus-config.js?v=20261001"></script>'
              if anchor not in s:
                  raise SystemExit('plus-config anchor not found')
              s=s.replace(anchor,tag+anchor,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Billiards_layout_mobile/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load mobile landscape add-on'
          git push
