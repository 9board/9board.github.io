name: Fix mobile score clock and auth flash

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-score-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh score add-on version only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Billiards_layout_mobile/index.html')
          s=p.read_text()
          for old in ['score-clock.js?v=20261002-clock2','score-clock.js?v=20261002-clock3']:
              s=s.replace(old,'score-clock.js?v=20261002-clock4')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Billiards_layout_mobile/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh mobile score add-on cache'
          git push
