name: Fix LINE stamp crop once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-line-stamp-crop-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore LINE stamp crop with clickable link
        shell: python
        run: |
          from pathlib import Path
          p = Path('home.css')
          s = p.read_text(encoding='utf-8')
          old = '.reference-stamps>img{position:absolute;left:0;top:-336.3%;width:100%;height:auto;max-width:none}'
          new = '.reference-stamps>img,.reference-stamps>a>img{position:absolute;left:0;top:-336.3%;width:100%;height:auto;max-width:none}'
          if old not in s:
              raise SystemExit('target LINE stamp crop rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.css
          git rm .github/workflows/fix-line-stamp-crop-once.yml
          git commit -m "Fix LINE stamp image crop"
          git push
