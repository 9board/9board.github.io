name: Fix line endpoint handles
on:
  push:
    paths:
      - '.github/workflows/fix-line-endpoint-handles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile layout handle behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Billiards_layout_mobile/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('let tool="move",balls=[],lines=[],memos=[],history=[],future=[],drawing=null,drag=null,selectedLineId=null,selectedBallId=null,lineColor="#ffffff",lineWidth=1,ghostAuto=false,tip={x:.5,y:.5};',
                      'let tool="move",balls=[],lines=[],memos=[],history=[],future=[],drawing=null,drag=null,selectedLineId=null,selectedLineEndpoint=null,selectedBallId=null,lineColor="#ffffff",lineWidth=1,ghostAuto=false,tip={x:.5,y:.5};')

          old='function updateEndpointHandles(){if(tool!=="move"||selectedLineId==null||pinch||(drag&&drag.kind==="all")){hideEndpointHandles();return}const l=lines.find(x=>String(x.id)===String(selectedLineId));if(!l){hideEndpointHandles();return}const inv=1/Math.max(.001,zoom.scale);for(const end of ["start","end"]){const h=endpointHandles[end],ep=endpointOf(l,end);let pos;if(drag&&drag.kind==="line-end-handle"&&drag.handle===end&&String(drag.id)===String(l.id)){pos={x:ep.x+drag.offsetX,y:ep.y+drag.offsetY};h.classList.add("dragging")}else{pos=endpointHandlePosition(l,end);h.classList.remove("dragging")}h.style.left=clamp(pos.x,3,97)+"%";h.style.top=clamp(pos.y,4,96)+"%";h.style.transform=`translate(-50%,-50%) scale(${inv})`;h.classList.add("visible")}}'
          new='function updateEndpointHandles(){hideEndpointHandles();if(tool!=="move"||selectedLineId==null||!selectedLineEndpoint||pinch||(drag&&drag.kind==="all"))return;const l=lines.find(x=>String(x.id)===String(selectedLineId));if(!l)return;const end=selectedLineEndpoint,h=endpointHandles[end],ep=endpointOf(l,end),inv=1/Math.max(.001,zoom.scale);let pos;if(drag&&drag.kind==="line-end-handle"&&drag.handle===end&&String(drag.id)===String(l.id)){pos={x:ep.x+drag.offsetX,y:ep.y+drag.offsetY};h.classList.add("dragging")}else{pos=endpointHandlePosition(l,end)}h.style.left=clamp(pos.x,3,97)+"%";h.style.top=clamp(pos.y,4,96)+"%";h.style.transform=`translate(-50%,-50%) scale(${inv})`;h.classList.add("visible")}'
          if old not in s: raise SystemExit('updateEndpointHandles target not found')
          s=s.replace(old,new)

          s=s.replace('function clearSelection(){selectedBallId=null;selectedLineId=null;moveHandle.dataset.side="";moveHandle.classList.remove("visible");hideEndpointHandles();hideAim();renderLines()}',
                      'function clearSelection(){selectedBallId=null;selectedLineId=null;selectedLineEndpoint=null;moveHandle.dataset.side="";moveHandle.classList.remove("visible");hideEndpointHandles();hideAim();renderLines()}')
          s=s.replace('function selectBall(id){selectedBallId=id;selectedLineId=null;moveHandle.dataset.side="";hideEndpointHandles();renderLines();updateMoveHandle(true)}',
                      'function selectBall(id){selectedBallId=id;selectedLineId=null;selectedLineEndpoint=null;moveHandle.dataset.side="";hideEndpointHandles();renderLines();updateMoveHandle(true)}')
          s=s.replace('function selectLine(id){selectedLineId=id;selectedBallId=null;moveHandle.dataset.side="";renderLines();updateMoveHandle(true)}',
                      'function selectLine(id,endpoint=null){selectedLineId=id;selectedLineEndpoint=endpoint;selectedBallId=null;moveHandle.dataset.side="";renderLines();updateMoveHandle(true)}')

          old='function lineDown(e){e.stopPropagation();e.preventDefault();const id=e.currentTarget.dataset.lineId,l=lines.find(x=>String(x.id)===String(id));if(!l)return;if(tool==="erase"){lines=lines.filter(x=>String(x.id)!==String(id));if(String(selectedLineId)===String(id))selectedLineId=null;commit();renderLayout();return}if(tool!=="move")return;selectLine(l.id)}'
          new='function lineDown(e){e.stopPropagation();e.preventDefault();const id=e.currentTarget.dataset.lineId,l=lines.find(x=>String(x.id)===String(id));if(!l)return;if(tool==="erase"){lines=lines.filter(x=>String(x.id)!==String(id));if(String(selectedLineId)===String(id)){selectedLineId=null;selectedLineEndpoint=null}commit();renderLayout();return}if(tool!=="move")return;const p=point(e),r=felt.getBoundingClientRect(),de=displayArrowEnd(l),ds=Math.hypot((p.x-l.x1)*r.width/100,(p.y-l.y1)*r.height/100),depx=Math.hypot((p.x-de.x)*r.width/100,(p.y-de.y)*r.height/100),endpointThreshold=18;let endpoint=null;if(depx<=endpointThreshold||ds<=endpointThreshold)endpoint=depx<=ds?"end":"start";selectLine(l.id,endpoint)}'
          if old not in s: raise SystemExit('lineDown target not found')
          s=s.replace(old,new)

          s=s.replace('function endpointHandleDown(end,e){e.stopPropagation();e.preventDefault();if(tool!=="move"||selectedLineId==null)return;',
                      'function endpointHandleDown(end,e){e.stopPropagation();e.preventDefault();if(tool!=="move"||selectedLineId==null)return;selectedLineEndpoint=end;')

          s=s.replace('selectedLineId=finished.id;selectedBallId=null;moveHandle.dataset.side="";commit();renderLayout()',
                      'selectedLineId=finished.id;selectedLineEndpoint=null;selectedBallId=null;moveHandle.dataset.side="";commit();renderLayout()')

          s=s.replace('selectedBallId=null;selectedLineId=null;moveHandle.dataset.side="";hideEndpointHandles();commit();renderLayout();setZoom(1)',
                      'selectedBallId=null;selectedLineId=null;selectedLineEndpoint=null;moveHandle.dataset.side="";hideEndpointHandles();commit();renderLayout();setZoom(1)')
          s=s.replace('selectedBallId=null;selectedLineId=null;moveHandle.dataset.side="";hideEndpointHandles();keepBallsOnCloth();',
                      'selectedBallId=null;selectedLineId=null;selectedLineEndpoint=null;moveHandle.dataset.side="";hideEndpointHandles();keepBallsOnCloth();')

          s=s.replace('data-build="2026-09-30-crosshandle-v3"','data-build="2026-09-30-crosshandle-v4"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-line-endpoint-handles.yml
          git add Billiards_layout_mobile/index.html .github/workflows/fix-line-endpoint-handles.yml
          git commit -m "線・矢印の指アイコン表示を整理"
          git push