name: PC interaction fix one off

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pc-interaction-fix-once.yml

permissions:
  contents: write

jobs:
  patch-pc:
    runs-on: ubuntu-latest
    steps:
      - name: Clone, patch and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pc/index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '<button class="tool active" data-tool="move"><span class="ico">✋</span><span class="text">移動</span></button>',
              '<button class="tool" data-tool="move"><span class="ico">✋</span><span class="text">移動</span></button>',
              'default move button state'
          )

          replace_once(
              '<div><strong>配置編集</strong><div class="status" id="status">縦向き・移動モード</div></div>',
              '<div><strong>配置編集</strong><div class="status" id="status">横向き・ツール未選択</div></div>',
              'initial status text'
          )

          replace_once(
              'orientation:"landscape", tool:"move", lineType:"arrow", lineColor:"#ffffff", lineWidth:1,',
              'orientation:"landscape", tool:"none", lineType:"arrow", lineColor:"#ffffff", lineWidth:1,',
              'default tool state'
          )

          replace_once(
              'function removeBall(id){ snap(); state.balls=state.balls.filter(b=>b.id!==id); renderBalls(); }',
              '''function removeBall(id){
  const target=state.balls.find(b=>b.id===id);
  if(!target)return;
  snap();
  // Deleting one ball must never move or reattach any other object.
  // Freeze an attached endpoint at the deleted ball's current position, then detach only that endpoint.
  state.lines.forEach(l=>{
    if(l.startBallId===id){l.x1=target.x;l.y1=target.y;delete l.startBallId}
    if(l.endBallId===id){l.x2=target.x;l.y2=target.y;delete l.endBallId}
  });
  pointerAction=null;
  state.balls=state.balls.filter(b=>b.id!==id);
  renderBalls();
  renderLines();
}''',
              'isolated ball deletion'
          )

          replace_once(
              '''        state.lines.push(line);pointerAction={type:"draw",id:line.id};renderLines();el.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();return;
      }
      moved=false; el.setPointerCapture(e.pointerId); snap();showAim(e);''',
              '''        state.lines.push(line);pointerAction={type:"draw",id:line.id};renderLines();el.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();return;
      }
      // A ball may move only when the Move tool is explicitly selected.
      if(state.tool!=="move"){e.preventDefault();e.stopPropagation();return;}
      moved=false; el.setPointerCapture(e.pointerId); snap();showAim(e);''',
              'explicit ball move gating'
          )

          replace_once(
              '''function nearestBall(x,y){
  const r=cloth.getBoundingClientRect();let best=null,bestPx=Infinity;
  state.balls.filter(b=>!b.ghost).forEach(b=>{
    const d=Math.hypot((b.x-x)*r.width,(b.y-y)*r.height);
    if(d<bestPx){best=b;bestPx=d}
  });
  return bestPx<=24*state.zoom?best:null;
}''',
              '''function nearestBall(x,y){
  const r=cloth.getBoundingClientRect();let best=null,bestPx=Infinity;
  state.balls.filter(b=>!b.ghost).forEach(b=>{
    const d=Math.hypot((b.x-x)*r.width,(b.y-y)*r.height);
    if(d<bestPx){best=b;bestPx=d}
  });
  return bestPx<=24*state.zoom?best:null;
}
function nearestCueBall(x,y){
  const r=cloth.getBoundingClientRect();let best=null,bestPx=Infinity;
  state.balls.filter(b=>!b.ghost&&b.n===0).forEach(b=>{
    const d=Math.hypot((b.x-x)*r.width,(b.y-y)*r.height);
    if(d<bestPx){best=b;bestPx=d}
  });
  return bestPx<=28*state.zoom?best:null;
}''',
              'cue ball snap helper'
          )

          replace_once(
              '''      if(startAttached||endAttached){
        const r=cloth.getBoundingClientRect();
        const dx=(l.x2-l.x1)*r.width;
        const dy=(l.y2-l.y1)*r.height;
        const len=Math.hypot(dx,dy);
        if(len>0){
          const ux=dx/len,uy=dy/len;
          const handleOffset=10*state.zoom;
          if(startAttached){
            hx1=l.x1+ux*(handleOffset/r.width);
            hy1=l.y1+uy*(handleOffset/r.height);
          }
          if(endAttached){
            hx2=l.x2-ux*(handleOffset/r.width);
            hy2=l.y2-uy*(handleOffset/r.height);
          }
        }
      }''',
              '''      if(startAttached||endAttached||l.type==="arrow"){
        const r=cloth.getBoundingClientRect();
        const dx=(l.x2-l.x1)*r.width;
        const dy=(l.y2-l.y1)*r.height;
        const len=Math.hypot(dx,dy);
        if(len>0){
          const ux=dx/len,uy=dy/len;
          const handleOffset=10*state.zoom;
          if(startAttached){
            hx1=l.x1+ux*(handleOffset/r.width);
            hy1=l.y1+uy*(handleOffset/r.height);
          }
          if(endAttached){
            hx2=l.x2-ux*(handleOffset/r.width);
            hy2=l.y2-uy*(handleOffset/r.height);
          }else if(l.type==="arrow"){
            // Put the invisible resize hit area slightly behind the arrow tip so it is easy to grab.
            const tipHandleOffset=8*state.zoom;
            hx2=l.x2-ux*(tipHandleOffset/r.width);
            hy2=l.y2-uy*(tipHandleOffset/r.height);
          }
        }
      }''',
              'arrow tip resize hit area'
          )

          replace_once(
              '''    [h1,h2].forEach(h=>{
      h.setAttribute("r","12");
      h.setAttribute("fill","rgba(0,0,0,0.001)");
      h.setAttribute("stroke","rgba(0,0,0,0.001)");
      h.setAttribute("stroke-width","6");
      h.classList.add("line-end-hit");
      h.style.pointerEvents=state.tool==="move"?"all":"none";
      h.style.cursor="grab";
    });''',
              '''    [h1,h2].forEach(h=>{
      h.setAttribute("r",h===h2&&l.type==="arrow"?"18":"14");
      h.setAttribute("fill","rgba(0,0,0,0.001)");
      h.setAttribute("stroke","rgba(0,0,0,0.001)");
      h.setAttribute("stroke-width","8");
      h.classList.add("line-end-hit");
      // Endpoint resize is available in neutral mode too; whole-object movement still requires Move.
      h.style.pointerEvents=(state.tool==="move"||state.tool==="none")?"all":"none";
      h.style.cursor="grab";
    });''',
              'endpoint handle behavior'
          )

          replace_once(
              '''    function startResize(which,h,e){
      if(state.tool!=="move")return;''',
              '''    function startResize(which,h,e){
      if(state.tool!=="move"&&state.tool!=="none")return;''',
              'resize allowed in neutral mode'
          )

          replace_once(
              '''      const p=normPoint(e);

      if(which==="start"){
        l.x1=p.x;
        l.y1=p.y;
      }else{
        l.x2=p.x;
        l.y2=p.y;
      }

      // If the other end is attached, keep it locked while length changes.
      syncLineAttachments(l);
      setCoords();''',
              '''      const p=normPoint(e);
      // Match the mobile behavior: the base prefers a cue ball and snaps to its exact center.
      const snapBall=which==="start"?(nearestCueBall(p.x,p.y)||nearestBall(p.x,p.y)):nearestBall(p.x,p.y);

      if(which==="start"){
        if(snapBall){l.startBallId=snapBall.id;l.x1=snapBall.x;l.y1=snapBall.y}
        else{delete l.startBallId;l.x1=p.x;l.y1=p.y}
      }else{
        if(snapBall){l.endBallId=snapBall.id;l.x2=snapBall.x;l.y2=snapBall.y}
        else{delete l.endBallId;l.x2=p.x;l.y2=p.y}
      }

      // If the opposite end is attached, keep it locked while length changes.
      syncLineAttachments(l);
      setCoords();''',
              'live endpoint snapping'
          )

          completed = 'if(completedLine)setTool("move");'
          completed_count = text.count(completed)
          if completed_count != 2:
              raise SystemExit(f'completed line neutral state: expected 2 matches, got {completed_count}')
          text = text.replace(completed, 'if(completedLine)setTool("none");')

          replace_once(
              '''  const names={move:"移動",group:"全部まとめて移動",arrow:"矢印",line:"線",erase:"削除",memo:"メモ"};
  status.textContent=`${o}・${names[state.tool]||state.tool}モード`;
  const msgs={move:"球をドラッグして動かせます",arrow:"台の上をドラッグして矢印を描けます",line:"台の上をドラッグして線を描けます",memo:"台をクリックするとメモを追加できます",erase:"球や線をクリックすると削除できます",group:"台の余白をドラッグすると全部まとめて移動します"};''',
              '''  const names={none:"ツール未選択",move:"移動",group:"全部まとめて移動",arrow:"矢印",line:"線",erase:"削除",memo:"メモ"};
  status.textContent=state.tool==="none"?`${o}・ツール未選択`:`${o}・${names[state.tool]||state.tool}モード`;
  const msgs={none:"操作するツールを選んでください",move:"球をドラッグして動かせます",arrow:"台の上をドラッグして矢印を描けます",line:"台の上をドラッグして線を描けます",memo:"台をクリックするとメモを追加できます",erase:"球や線をクリックすると削除できます",group:"台の余白をドラッグすると全部まとめて移動します"};''',
              'neutral tool status'
          )

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix PC delete, snap and arrow resize behavior"
          git push origin HEAD:main
