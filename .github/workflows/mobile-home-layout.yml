name: Sharpen mobile Home icon

on:
  push:
    paths:
      - '.github/workflows/mobile-home-layout.yml'

permissions:
  contents: write

jobs:
  update-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sharpen Home icon rendering only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Billiards_layout_mobile/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '.nav-btn.active .nav-art{outline:2px solid rgba(7,132,95,.18);outline-offset:1px}'
          addition = '.nav-btn[data-to="home"] .nav-art{image-rendering:-webkit-optimize-contrast;image-rendering:high-quality;transform:translateZ(0);backface-visibility:hidden}'
          if addition not in s:
              s = s.replace(marker, marker + addition, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Billiards_layout_mobile/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Improve Home nav icon rendering quality only"
            git push
          fi
