name: Repair and upscale mobile Home icon

on:
  push:
    paths:
      - '.github/workflows/mobile-home-layout.yml'

permissions:
  contents: write

jobs:
  update-home-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JPEG and upscale Home icon only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('Billiards_layout_mobile/assets/home-20260922-v2.jpg').read_bytes()
          end = src.find(b'\xff\xd9')
          if end < 0:
              raise SystemExit('JPEG EOI not found')
          Path('/tmp/home-repaired.jpg').write_bytes(src[:end+2])
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          identify /tmp/home-repaired.jpg
          convert /tmp/home-repaired.jpg -filter Lanczos -resize 400% -unsharp 0x0.75+0.75+0.008 -quality 96 Billiards_layout_mobile/assets/home-20260922-v2-hq.jpg
          identify Billiards_layout_mobile/assets/home-20260922-v2-hq.jpg
      - name: Point Home icon to repaired HQ source only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Billiards_layout_mobile/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('./assets/home-20260922-v2.jpg?v=20260922-3', './assets/home-20260922-v2-hq.jpg?v=20260930-hq3')
          s = s.replace('./assets/home-20260922-v2-hq.jpg?v=20260930-hq2', './assets/home-20260922-v2-hq.jpg?v=20260930-hq3')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Home icon quality change only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Billiards_layout_mobile/assets/home-20260922-v2-hq.jpg Billiards_layout_mobile/index.html
          git diff --cached -- Billiards_layout_mobile/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Repair and use high resolution Home nav icon"
            git push
          fi
# repair-home-icon-hq3
