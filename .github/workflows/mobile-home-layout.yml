name: Mobile home opens layout

on:
  push:
    paths:
      - '.github/workflows/mobile-home-layout.yml'

permissions:
  contents: write

jobs:
  update-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename mobile navigation labels only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Billiards_layout_mobile/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<span>カウンター</span>', '<span>スコア</span>')
          s = s.replace('<span>メニュー</span>', '<span>設定</span>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Billiards_layout_mobile/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Rename Counter to Score and Menu to Settings"
            git push
          fi
