<!doctype html>
<html lang="ja">
<head>
<link rel="icon" type="image/png" href="/assets/9board-favicon.png?v=20261001-bird">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>9BOARD PCアプリ</title>
<link rel="stylesheet" href="/home.css?v=20261002-selected">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faf7}body{display:flex;flex-direction:column}.header{flex:0 0 auto;position:relative;z-index:1000;background:#fff}.app-shell{flex:1 1 auto;min-height:0;width:100%;background:#f5faf7}#appFrame{display:block;width:100%;height:100%;border:0;background:#f5faf7}
</style>
</head>
<body>
<header class="header"><div class="wrap head"><a href="https://9board.jp/" aria-label="9BOARD ホーム"><img class="logo" src="/assets/original-logo.png" width="2156" height="729" alt="9BOARD"></a><button class="menu" aria-expanded="false" aria-controls="navigation">☰ メニュー</button><nav class="nav" id="navigation" aria-label="メインナビゲーション"><a href="https://9board.jp/">トップ</a><a href="#" data-app="layout">配置図</a><a href="#" data-app="score">スコア</a><a href="#" data-app="records">対戦記録</a><a href="https://9board.jp/#terms">利用規約</a><a href="https://9board.jp/#privacy">プライバシー</a><a href="https://waraka2026.github.io/">warakaについて</a><a class="contact" href="https://waraka2026.github.io/#contact">✉ お問い合わせ</a></nav></div></header>
<main class="app-shell"><iframe id="appFrame" src="/pc/app-patched.html?v=20261003-direct" title="9BOARD 配置図"></iframe></main>
<script>
const APPS={layout:'/pc/app-patched.html?v=20261003-direct',score:'/Billiards_counter/',records:'/Billiardsmatch-records/'};const frame=document.getElementById('appFrame'),button=document.querySelector('.menu'),nav=document.querySelector('.nav');document.querySelectorAll('[data-app]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();frame.src=APPS[a.dataset.app];frame.title='9BOARD '+a.textContent.trim();button.setAttribute('aria-expanded','false');nav.classList.remove('open')}));button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));nav.classList.toggle('open',open)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){button.setAttribute('aria-expanded','false');nav.classList.remove('open')}});
</script>
</body></html>
