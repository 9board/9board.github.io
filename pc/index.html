<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>9BOARD 配置図</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faf7}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f5faf7}
</style>
</head>
<body>
<iframe id="appFrame" src="./app.html" title="9BOARD 配置図"></iframe>
<script>
const HOME='https://9board.jp/';
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    const logo=doc.getElementById('brandLogo');
    if(logo){
      const fresh=logo.cloneNode(true);
      fresh.title='9BOARD トップページ';
      fresh.alt='9BOARD';
      fresh.style.cursor='pointer';
      logo.replaceWith(fresh);
      fresh.addEventListener('click',()=>{window.top.location.href=HOME});
    }
    const nav=doc.querySelector('.topnav');
    if(nav&&!nav.querySelector('[data-home-link]')){
      const btn=doc.createElement('button');
      btn.type='button';
      btn.dataset.homeLink='true';
      btn.textContent='⌂ トップ';
      btn.addEventListener('click',()=>{window.top.location.href=HOME});
      nav.insertBefore(btn,nav.firstChild);
    }
  }catch(_){ }
});
</script>
</body>
</html>
