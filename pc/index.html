<!doctype html><html lang="ja"><head><link rel="icon" type="image/png" href="/assets/9board-favicon.png?v=20261001-bird"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>9BOARD PCアプリ</title><link rel="stylesheet" href="/home.css?v=20261002-selected"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faf7}body{display:flex;flex-direction:column}.header{flex:0 0 auto;position:relative;z-index:1000;background:#fff}.app-shell{flex:1 1 auto;min-height:0;width:100%;background:#f5faf7;overflow:hidden;position:relative}#appFrame{display:block;width:100%;height:calc(100% + 100px);border:0;background:#f5faf7;position:absolute;left:0;top:-100px}</style></head><body><header class="header"><div class="wrap head"><a href="https://9board.jp/" aria-label="9BOARD ホーム"><img class="logo" src="/assets/original-logo.png" width="2156" height="729" alt="9BOARD"></a><button class="menu" aria-expanded="false" aria-controls="navigation">☰ メニュー</button><nav class="nav" id="navigation" aria-label="メインナビゲーション"><a href="https://9board.jp/">トップ</a><a href="#layout" data-app="layout">配置図</a><a href="#score" data-app="score">スコア</a><a href="#records" data-app="records">対戦記録</a><a href="https://9board.jp/#terms">利用規約</a><a href="https://9board.jp/#privacy">プライバシー</a><a href="https://waraka2026.github.io/">warakaについて</a><a class="contact" href="https://waraka2026.github.io/#contact">✉ お問い合わせ</a></nav></div></header><main class="app-shell"><iframe id="appFrame" src="/pc/app.html?v=20261003-2308" title="9BOARD 配置図" allow="clipboard-read; clipboard-write"></iframe></main><script>const APPS={layout:'/pc/app.html?v=20261003-2308',score:'/Billiards_counter/?v=20261003-2308',records:'/Billiardsmatch-records/?v=20261003-2308'};const NAMES={layout:'配置図',score:'スコア',records:'対戦記録'};const frame=document.getElementById('appFrame'),button=document.querySelector('.menu'),nav=document.querySelector('.nav');function setCrop(key){const crop=key==='records'?100:96;frame.style.top='-'+crop+'px';frame.style.height='calc(100% + '+crop+'px)'}function openApp(key,push=false){if(!APPS[key])key='layout';setCrop(key);const src=APPS[key];if(frame.getAttribute('src')!==src)frame.setAttribute('src',src);frame.title='9BOARD '+NAMES[key];document.querySelectorAll('[data-app]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.app===key));if(push&&location.hash!=='#'+key)history.pushState(null,'','#'+key)}document.querySelectorAll('[data-app]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openApp(a.dataset.app,true);button.setAttribute('aria-expanded','false');nav.classList.remove('open')}));window.addEventListener('hashchange',()=>openApp(location.hash.slice(1)||'layout'));button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));nav.classList.toggle('open',open)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){button.setAttribute('aria-expanded','false');nav.classList.remove('open')}});openApp(location.hash.slice(1)||'layout');</script></body></html>
