<!doctype html><html lang="ja" class="nineboard-authenticated"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>9BOARD モバイル版 操作体験</title><link rel="stylesheet" href="demo.css?v=authentic1"></head><body>
<div class="phone">
<main class="app-view" id="appView">
<section class="screen active" data-screen="layout">
<header class="topbar"><div><strong>配置図</strong><small>Layout Maker</small></div></header>
<div class="wrap">
<p class="demo-restriction">体験版のため機能を制限しています。球1〜3番の配置と矢印のみ操作できます。</p><div class="page-head"><h1>配置を作る</h1><div class="page-head-actions"><button id="tableOrientationBtn" class="table-orientation-btn" type="button" aria-label="台を縦向きにする" title="台を縦向きにする"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><button id="clearLayout">リセット</button></div></div>
<div class="layout-card">
<div class="table-viewport" id="tableViewport"><div class="table-stage" id="tableStage"><img class="table-frame" src="/pc/assets/reference-table-clean-v2.png?v=20260921-new9board-1" alt=""><div class="cloth grid-on" id="felt"><svg id="svgLayer"></svg><div id="aimGuide"></div><div id="aimDragLayer"><div id="aimDragVertical" class="aim-drag-hit vertical"></div><div id="aimDragHorizontal" class="aim-drag-hit horizontal"></div></div><div id="ballsLayer"></div><div id="notesLayer"></div><div id="moveHandle" class="object-move-handle" aria-label="移動できます"></div><div id="lineStartHandle" class="endpoint-control-handle" aria-label="線の始点を調整"></div><div id="lineEndHandle" class="endpoint-control-handle" aria-label="線の先端を調整"></div></div></div><div class="memo-actions" id="memoActions" hidden><button type="button" id="memoEditAction">編集</button><button type="button" data-action="delete" id="memoDeleteAction">削除</button><button type="button" id="memoOrientationAction" aria-label="メモの向きを変更" title="向きを変更">向き</button></div></div>
<div class="toolbar" id="layoutToolbar">
<button class="tool" data-tool="move">✋<span>移動</span></button><button class="tool" data-tool="moveall">✥<span>全部移動</span></button><button class="tool" data-tool="arrow">↗<span>矢印</span></button><button class="tool" data-tool="line">╱<span>線</span></button><button class="tool" data-tool="erase">⌫<span>削除</span></button><button class="tool" data-tool="memo">✎<span>メモ</span></button><button class="tool" id="undoBtn">↶<span>戻る</span></button><button class="tool" id="redoBtn">↷<span>進む</span></button><button class="tool" id="zoomOut">−<span>縮小</span></button><button class="tool" id="zoomIn">＋<span>拡大</span></button><button class="tool" id="zoomReset">◎<span>拡大リセット</span></button>
</div>
<div class="ball-size-controls" id="ballSizeControls" hidden><span>選択した球のサイズ</span><button id="ballSizeDown" type="button" aria-label="球を縮小">−</button><output id="ballSizeValue">標準</output><button id="ballSizeUp" type="button" aria-label="球を拡大">＋</button></div>
<dialog id="memoDialog" class="memo-dialog"><h2 id="memoDialogTitle">メモを追加</h2><form id="memoForm"><label>メモの文字<input id="memoText" type="text" maxlength="120" placeholder="メモを入力"></label><div class="memo-options"><label>文字サイズ <output id="memoSizeValue">10px</output><input id="memoSize" type="range" min="10" max="24" step="2" value="10"></label><label>文字の太さ<select id="memoWeight"><option value="600">標準</option><option value="900">太字</option></select></label></div><div class="memo-color-row"><label>文字カラー<input id="memoColor" type="color" value="#25312d"></label><label>背景カラー<input id="memoBackgroundColor" type="color" value="#fff6c8"></label><label class="memo-inline"><input id="memoBackground" type="checkbox" checked> 背景あり</label></div><div class="memo-dialog-actions"><button id="memoCancel" type="button">キャンセル</button><button id="memoSubmit" type="submit">台をタップして配置</button></div></form></dialog>
<div class="ballbar-title">ボール</div><div class="ballbar" id="ballbar"></div><div class="setting-row ghost-switch-row"><span>イメージボール</span><button class="switch" id="ghostSwitch" aria-label="イメージボール"><i></i></button></div>
<div class="layout-settings"><div class="layout-setting-title">╱ 線・矢印の設定</div><div class="line-type"><button id="typeArrow" class="active">↗ 矢印</button><button id="typeLine">╱ 線</button></div><div class="setting-row"><span>カラー</span><input id="colorPicker" type="color" value="#ffffff"></div><div class="swatches" id="swatches"></div><div class="setting-row"><span>太さ</span><input id="widthRange" type="range" min="1" max="8" value="1"><b id="widthValue">1</b></div></div>
<div class="layout-settings"><div class="cue-card"><div class="cue-diagram" id="cueDiagram"><span class="tip-dot" id="tipDot" style="left:50%;top:50%"></span></div><div class="cue-side"><b>赤い点をドラッグ</b><div class="tip-help">手玉のどこを撞くかを記録</div></div></div><div class="cue-actions"><button id="tipClearBtn" class="cue-clear-btn">印を消す</button><div class="cue-image-option"><span>画像保存に撞点を表示</span><button class="switch on" id="exportCuePointSwitch" type="button" aria-label="画像保存に撞点を表示" aria-pressed="true"><i></i></button></div></div></div>
<div class="save-grid"><button id="saveLayout">✓ 配置を保存</button><button id="exportPng" class="alt">▣ 画像保存</button></div>
</div>
<div class="section-title"><h2>保存した配置</h2><button id="clearSavedLayouts">すべて削除</button></div><div class="card" id="savedLayouts"></div>
</div>
</section>
<section class="screen" data-screen="counter"><header class="topbar"><div><strong>スコア</strong><small>Practice Counter</small></div><button id="resetCounter" class="circle-btn">↻</button></header><div class="wrap" id="counterMain"><div class="page-head"><h1>スコア</h1><button id="saveCounter">記録する</button></div><div class="counter-card"><div class="score-two-cols score-meta"><label>場所<input id="scoreVenue" placeholder="会場名"></label><label>日付<input id="scoreDate" type="date" required></label></div><div class="counter-row"><div class="player"><input id="p1name" placeholder="名前" aria-label="名前"><div class="score" id="p1score">0</div><div class="score-controls"><button data-score="p1" data-delta="-1">−</button><button data-score="p1" data-delta="1">＋</button></div></div><div class="vs">VS</div><div class="player"><input id="p2name" placeholder="名前" aria-label="名前"><div class="score" id="p2score">0</div><div class="score-controls"><button data-score="p2" data-delta="-1">−</button><button data-score="p2" data-delta="1">＋</button></div></div></div><label class="race">ゲーム形式<select id="raceType"><option>9ボール</option><option>8ボール</option><option>10ボール</option></select></label></div><div class="section-title"><h2>最近の対戦</h2><div class="score-history-tools"><button id="counterCsv">CSVダウンロード</button><button id="clearCounterHistory">履歴削除</button></div></div><div class="card" id="counterHistory"></div></div><div class="wrap" id="counterRecordPane" hidden></div></section>
<section class="screen" data-screen="matches"><header class="topbar"><div><strong id="matchHeading">対戦一覧</strong><small>Match Records</small></div></header><div class="wrap"><div class="page-head"><div id="matchTools"><span id="matchCount" aria-live="polite"></span><button id="matchView" aria-label="カレンダー表示" title="カレンダー表示"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h2m3 0h2m3 0h1m-11 4h2m3 0h2"/></svg></button> <button id="newMatchText">新規</button></div></div><form id="matchForm" class="new-form"><div class="cols"><label>日付<input type="date" id="matchDate" required></label><label>状態<select id="matchStatus"><option>終了</option><option>予定</option></select></label></div><label>大会名 / 対戦名<input id="matchTitle"></label><label>会場名<input id="matchVenue"></label><div class="cols"><label>対戦相手<input id="matchOpponent"></label><label>結果<input id="matchResult" placeholder="4-2"></label></div><div class="cols"><label>セット数<input id="matchRace" placeholder="4先"></label><label>エントリーフィー<input id="matchFee" inputmode="numeric"></label></div><label>URL<input id="matchUrl" type="url" placeholder="https://"></label><label>配置図（Plus）<select id="plusLayoutLink"><option value="">配置図なし</option></select></label><label>メモ<textarea id="matchMemo"></textarea></label><div class="save-grid"><button type="submit">保存</button><button type="button" class="alt" id="cancelMatch">閉じる</button></div></form><div class="new-form" id="matchDetail" hidden></div><div class="card" id="matchCalendar" hidden></div><div class="card" id="matchList"></div></div></section>
<section class="screen" data-screen="menu"><header class="topbar"><div><strong>メニュー</strong><small>9BOARD Mobile</small></div></header><div class="wrap"><div class="menu-card"><div id="plusSettings" class="menu-row" style="display:block"></div><a class="menu-row official-site-link" href="https://9board.jp/" target="_blank" rel="noopener noreferrer">9BOARD 公式サイト <span>↗</span></a><div class="menu-row">使い方 / ヘルプ <span>›</span></div><div class="menu-row">利用規約 <span>›</span></div><div class="menu-row">プライバシーポリシー <span>›</span></div></div></div></section>
</main><div id="plusPreviewBar" hidden style="position:fixed;top:0;right:0;z-index:10000;background:#fff;padding:6px;border:1px solid #ddd;border-radius:8px;font-size:12px">検証用 <button data-preview-plan="free">Free</button> <button data-preview-plan="plus">Plus</button><span id="previewPlanLabel"></span></div>
<nav class="bottom-nav"><button class="nav-btn active" data-to="home"><img class="nav-art" src="/Billiards_layout_mobile/assets/home-20260922-v2-hq.jpg?v=20260930-hq4" alt=""><span>配置図</span></button><button class="nav-btn" data-to="counter"><img class="nav-art" src="/Billiards_layout_mobile/assets/counter-20260922-v3.jpg?v=20260922-3" alt=""><span>スコア</span></button><button class="nav-btn" data-to="matches"><img class="nav-art" src="/Billiards_layout_mobile/assets/matches-20260922-v3.jpg?v=20260922-3" alt=""><span>対戦記録</span></button><button class="nav-btn" data-to="menu"><img class="nav-art" src="/Billiards_layout_mobile/assets/menu-original-20260922.png?v=20260922-8" alt=""><span>設定</span></button></nav><div class="toast" id="toast"></div>
</div>

<script src="demo.js?v=authentic1"></script></body></html>
