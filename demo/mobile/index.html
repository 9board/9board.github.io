<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>9BOARD 操作体験版</title><link rel="stylesheet" href="demo.css"></head><body>
<header><img src="/assets/lp-original-logo.png" alt="9BOARD"><span class="badge">操作体験版</span></header><main><div class="heading"><h1>配置図を試してみよう</h1><button id="reset" type="button">リセット</button></div><p class="guide" id="guide" aria-live="polite">球をタップして追加し、指で動かせます。</p>
<div class="table" id="table"><svg id="board" viewBox="0 0 650 365" aria-label="1〜3番の球と矢印を配置できるビリヤード台"><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#fff"/></marker></defs><rect class="cloth" x="44" y="46" width="561" height="274"/><g id="arrows"></g><g id="balls"></g></svg></div>
<div class="toolbar" aria-label="配置ツール"><button type="button" class="mode active" data-mode="ball" aria-pressed="true">球を動かす</button><button type="button" class="mode" data-mode="arrow" aria-pressed="false">↗ 矢印を描く</button></div>
<div class="ball-panel"><p>使える球：1〜3番</p><div class="ball-picker"><button type="button" class="pick yellow" data-ball="1" aria-label="1番の球を追加"><span>1</span></button><button type="button" class="pick blue" data-ball="2" aria-label="2番の球を追加"><span>2</span></button><button type="button" class="pick red" data-ball="3" aria-label="3番の球を追加"><span>3</span></button></div><button type="button" class="clear-arrows" id="clearArrows">矢印を消す</button></div>
<p class="hint">球を選んだあとは、キーボードの矢印キーでも移動できます。</p>
<aside><strong>もっと使うなら、モバイル版へ</strong><p>すべての球・配置の保存・スコア・対戦記録は製品版で。</p><span>300円（税込）買い切り</span></aside><p class="notice">体験版の配置は保存されません。</p></main><script src="demo.js"></script></body></html>
